services:
  api:
    image: ${API_IMAGE:?API_IMAGE must reference the published API image}
    container_name: retour-emploi-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PATH: /app/artifacts/pipeline_meilleur_recall_f1.joblib
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - /srv/retour-emploi/artifacts:/app/artifacts
      - /srv/retour-emploi/data:/app/data:ro
      - /srv/retour-emploi/outputs:/app/outputs
    depends_on:
      mlflow:
        condition: service_healthy

  mlflow:
    image: ${API_IMAGE:?API_IMAGE must reference the published API image}
    container_name: retour-emploi-mlflow
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --default-artifact-root
      - mlflow-artifacts:/
      - --artifacts-destination
      - /mlartifacts
      - --allowed-hosts
      - mlflow,localhost,127.0.0.1
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow-data
      - mlflow-artifacts:/mlartifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:5000', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  mlflow-data:
  mlflow-artifacts:
